<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Bot</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f6f3; color: #1d1d1b; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .muted { color: #6b6b66; font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat { background: #fff; border: 1px solid #e4e4de; border-radius: 10px; padding: 14px 16px; }
  .stat b { display: block; font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: #6b6b66; }
  .stat.bad b { color: #b42318; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e4e4de; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid #eeeee8; vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #6b6b66; font-weight: 600; background: #fafaf7; }
  tr:last-child td { border-bottom: 0; }
  .when { white-space: nowrap; color: #6b6b66; font-size: 13px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; text-decoration: none; border: 1px solid transparent; }
  .chip.ok { background: #e7f4ec; color: #146c3a; }
  .chip.ok:hover { border-color: #146c3a; }
  .chip.fail { background: #fdecea; color: #b42318; cursor: help; }
  .empty { padding: 48px 16px; text-align: center; color: #6b6b66; background: #fff; border: 1px dashed #d8d8d0; border-radius: 10px; }
  footer { margin-top: 24px; font-size: 13px; }
  footer a { color: inherit; }
  @media (prefers-color-scheme: dark) {
    body { background: #141413; color: #ecece7; }
    .muted, .stat span, th, .when, .empty { color: #9d9d96; }
    .stat, table, .empty { background: #1d1d1b; border-color: #2e2e2b; }
    th { background: #222220; }
    th, td { border-bottom-color: #2a2a27; }
    .chip.ok { background: #16321f; color: #7fd49b; }
    .chip.ok:hover { border-color: #7fd49b; }
    .chip.fail { background: #3a1916; color: #f4978e; }
    .stat.bad b { color: #f4978e; }
  }
  @media (max-width: 600px) {
    thead { display: none; }
    tr { display: block; border-bottom: 1px solid #eeeee8; }
    td { display: block; border: 0; padding: 6px 14px; }
    td:first-child { padding-top: 12px; }
    td:last-child { padding-bottom: 12px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Shorts Bot</h1>
    <span class="muted" id="updated">Loading…</span>
  </header>
  <section class="stats" id="stats"></section>
  <section id="list"></section>
  <footer class="muted">Posts are generated and published automatically by GitHub Actions. <a href="privacy.html">Privacy policy</a></footer>
</main>
<script>
const NAMES = { youtube: "YouTube", facebook: "Facebook", instagram: "Instagram", x: "X" };

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function platformsOf(item) {
  if (item.platforms) return item.platforms;
  if (item.video_id) return { youtube: { status: "posted", url: "https://youtube.com/shorts/" + item.video_id } };
  return {};
}

function fmt(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

function stat(label, value, bad) {
  return `<div class="stat${bad ? " bad" : ""}"><b>${value}</b><span>${esc(label)}</span></div>`;
}

function render(history) {
  const items = [...history].reverse();
  const totals = {};
  let failures = 0;
  for (const item of items) {
    for (const [name, r] of Object.entries(platformsOf(item))) {
      totals[name] = totals[name] || 0;
      if (r.status === "posted") totals[name]++;
      else failures++;
    }
  }
  let stats = stat("videos made", items.length);
  for (const name of Object.keys(NAMES)) if (name in totals) stats += stat("on " + NAMES[name], totals[name]);
  stats += stat("failed posts", failures, failures > 0);
  document.getElementById("stats").innerHTML = stats;
  document.getElementById("updated").textContent = items.length ? "Last run " + fmt(items[0].date) : "No runs yet";

  if (!items.length) {
    document.getElementById("list").innerHTML = '<div class="empty">Nothing posted yet. The first run will show up here.</div>';
    return;
  }
  const rows = items.map(item => {
    const chips = Object.entries(platformsOf(item)).map(([name, r]) => {
      const label = NAMES[name] || name;
      return r.status === "posted"
        ? `<a class="chip ok" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`
        : `<span class="chip fail" title="${esc(r.error)}">${esc(label)} failed</span>`;
    }).join("");
    return `<tr><td>${esc(item.title)}</td><td class="when">${fmt(item.date)}</td><td><div class="chips">${chips || '<span class="muted">—</span>'}</div></td></tr>`;
  }).join("");
  document.getElementById("list").innerHTML =
    `<table><thead><tr><th>Video</th><th>Posted</th><th>Platforms</th></tr></thead><tbody>${rows}</tbody></table>`;
}

fetch("data/history.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : [])
  .then(render)
  .catch(() => {
    document.getElementById("updated").textContent = "Could not load history";
    render([]);
  });
</script>
</body>
</html>
